<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SRS WebRTC プレビュー</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}" />
    <script
      src="https://cdn.socket.io/4.7.4/socket.io.min.js"
      integrity="sha384-XlZSx8RJWb1x1oVsXusZfToi0gQqAUyrGuJn1Cj/dXHQEzKLgvEzBnq0XPSFpXVF"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <header>
      <h1>リアルタイム配信用プレビュー</h1>
      <p>
        PC のフロントカメラ映像を <abbr title="Simple Realtime Server">SRS</abbr> に送信し、
        <code>localhost:5000</code> でプレビューします。
      </p>
    </header>

    <main>
      <section class="panel">
        <h2>カメラ</h2>
        <video id="localVideo" autoplay playsinline muted></video>
        <div class="controls">
          <button id="startButton" class="primary">配信開始</button>
          <button id="stopButton" class="secondary" disabled>停止</button>
        </div>
      </section>

      <section class="panel">
        <h2>SRS 接続設定</h2>
        <form id="settingsForm">
          <label class="field">
            <span>SRS Publish API</span>
            <input type="url" id="apiUrl" name="apiUrl" required />
          </label>
          <label class="field">
            <span>ストリーム URL</span>
            <input type="text" id="streamUrl" name="streamUrl" required />
          </label>
          <label class="field">
            <span>再生 URL</span>
            <input type="text" id="playUrl" name="playUrl" required />
          </label>
          <p class="hint">
            既定値は <code>http://127.0.0.1:1985</code> で動作するローカル SRS を想定しています。
          </p>
        </form>
      </section>

      <section class="panel">
        <h2>状態</h2>
        <pre id="statusLog" class="status-log"></pre>
      </section>
    </main>

    <footer>
      <p>
        ブラウザからの WebRTC 送信には HTTPS もしくは localhost でのアクセスが必要です。
        また、SRS の <code>rtc.conf</code> で WebRTC を有効にしておいてください。
      </p>
    </footer>

    <script src="{{ url_for('static', filename='js/webrtc.js') }}" defer></script>
  </body>
</html>
